apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-app-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: gitops-app
      rules:
        - alert: GitopsAppLowReplicas
          expr: kube_deployment_status_replicas_available{deployment="gitops-app"} < 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "gitops-app has fewer than 2 healthy replicas"
        - alert: GitopsAppDown
          expr: up{job="gitops-app"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus cannot scrape gitops-app"