name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          push: false
          tags: gitops-app:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gitops-app:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/swlender/gitops-app:latest
            ghcr.io/swlender/gitops-app:${{ github.sha }}