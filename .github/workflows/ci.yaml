name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/swlender/gitops-app:latest
            ghcr.io/swlender/gitops-app:${{ github.sha }}